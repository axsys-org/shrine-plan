name: STE comments

on:
  pull_request:
    paths:
      - "**/*.foil"

permissions:
  contents: read

jobs:
  ste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: .ste-cache.json
          key: ste-cache-${{ github.run_id }}
          restore-keys: ste-cache-

      - name: Check comments
        run: python3 .github/ste/ste_lint.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STE_GLOBS: "*.foil"
