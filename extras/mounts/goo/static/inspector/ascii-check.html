<!doctype html><html><head><meta charset="utf-8"><title>Goo ASCII measurement check</title>
<link rel="stylesheet" href="/static/goo.generated.css"><link rel="stylesheet" href="/static/ascii-fonts.css"><link rel="stylesheet" href="/static/reference.css">
</head><body>
<h1>ASCII backend / browser comparison</h1><p id="summary">Loading fonts and generated fixtures...</p><pre id="report"></pre><div id="measure" style="position:absolute;left:-100000px;top:0;visibility:hidden"></div>
<script>
(async()=>{
 const cases=await (await fetch('/static/inspector/ascii-check-cases.json')).json();
 await Promise.all([400,520,550,620,650,750].map(w=>document.fonts.load(`${w} 14px "Goo Sans"`)));
 await document.fonts.load('14px "Goo Mono"');await document.fonts.load('italic 17px "Goo Sans"');await document.fonts.ready;
 const box=document.getElementById('measure'),failures=[],worst={width:0,height:0},totals={width:0,height:0},worstCases={};
 let checked=0;
 for(const c of cases){
  document.documentElement.style.setProperty('--goo-text-scale',c.scale);
  box.innerHTML=c.html;
  const el=box.querySelector("[data-leaf]");
  const h=el.getBoundingClientRect().height,he=Math.abs(h-c.height)/Math.max(1,c.height);
  if(he>worst.height)worstCases.height={node:c.node,scale:c.scale,width:c.width,expected:c.height,actual:h};
  worst.height=Math.max(worst.height,he);totals.height+=he;
  if(he>.03)failures.push({kind:'height',node:c.node,scale:c.scale,width:c.width,expected:c.height,actual:h,error:he});
  if(['text','button','code'].includes(c.node.kind)){
   box.innerHTML=c.unwrappedHtml;
   const natural=box.querySelector('[data-leaf]');natural.style.width='max-content';
   const w=natural.getBoundingClientRect().width,we=Math.abs(w-c.natural)/Math.max(1,c.natural);
   if(we>worst.width)worstCases.width={node:c.node,scale:c.scale,expected:c.natural,actual:w};
   worst.width=Math.max(worst.width,we);totals.width+=we;
   if(we>.03)failures.push({kind:'width',node:c.node,scale:c.scale,expected:c.natural,actual:w,error:we});
  }
  if(++checked%300===0)await new Promise(requestAnimationFrame);
 }
 document.getElementById('summary').textContent=`${failures.length?'FAIL':'PASS'}: ${checked} cases; worst width ${(100*worst.width).toFixed(3)}%; worst height ${(100*worst.height).toFixed(3)}%; ${failures.length} failures above 3%.`;
 document.getElementById('report').textContent=JSON.stringify({worst,worstCases,mean:{width:totals.width/checked,height:totals.height/checked},failures:failures.slice(0,30)},null,2);
 box.remove();
})().catch(e=>document.getElementById('summary').textContent='ERROR: '+e.message);
</script></body></html>
