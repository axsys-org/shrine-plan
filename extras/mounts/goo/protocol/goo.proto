syntax = "proto2";
package goo.wire.v2;

// Domain protocol. Geometry is finite IEEE754 binary64 in logical CSS pixels.
// Presence is meaningful: no protobuf defaults grant action authority.
message Response {
  required uint32 wire_version = 1;
  oneof payload {
    Presentation presentation = 2;
    LayoutBundle bundle = 3;
    Source source = 4;
    Snapshot snapshot = 5;
    OperationReceipt receipt = 6;
    Failure failure = 7;
  }
}
message Profile { required string id = 1; required uint32 version = 2; required string revision = 3; }
message Context { required double width = 1; required double textScale = 2; required string direction = 3; }
message Box { required double x = 1; required double y = 2; required double width = 3; required double height = 4; }
message Origin { required uint32 line = 1; required uint32 column = 2; }
message TextStyle {
  required string fontId = 1; required string fontSHA256 = 2; required string family = 3;
  required uint32 weight = 4; required string style = 5;
  required double fontSize = 6; required double lineHeight = 7; required double letterSpacing = 8;
  required double insetX = 9; required double insetY = 10;
  required bool kerning = 11; required bool ligatures = 12;
}
// A myth is a path-to-branded-pail map, not arbitrary JSON. Natural numbers and
// foreign brand identities are decimal strings because Foil naturals are unbounded.
message Myth { repeated MythEntry entries = 1; }
message MythEntry { required string path = 1; required Pail pail = 2; }
message Pail {
  oneof brand {
    string nat = 1; bool boolean = 2; string text = 3; string path = 4;
    Modifiers modifiers = 5; string weblink = 6; string unsupportedBrand = 7;
  }
}
message Modifiers { repeated string values = 1; }
message English { required string txt = 1; }
message Language { required English en = 1; }
message TextRun { required Myth myth = 1; required Language lang = 2; }
message TextRuns { repeated TextRun values = 1; }
message Link { required string kind = 1; optional string path = 2; optional string href = 3; }
message RunSemantics { required string role = 1; optional Link target = 2; }
message Highlight { required string fill = 1; required string stroke = 2; required double width = 3; required double radius = 4; }
message Underline { required string color = 1; required double width = 2; required double y = 3; }
message ResolvedRun {
  required uint32 version = 1; required TextStyle textStyle = 2; required string foreground = 3;
  optional Highlight highlight = 4; optional Underline underline = 5; required RunSemantics semantics = 6;
}
message RunFragment {
  required Myth myth = 1; required string lang = 2; required string text = 3;
  required Box box = 4; required double textX = 5; required double baseline = 6; optional ResolvedRun resolved = 7;
}
message RunFragments { repeated RunFragment values = 1; }
message Line {
  required string text = 1; required Box box = 2; required double textX = 3;
  required double baseline = 4; required double prefixAdvance = 5; optional RunFragments runs = 6;
}
message EditStyle { required Myth myth = 1; required ResolvedRun resolved = 2; }
message Editing {
  required uint32 version = 1; required string encoding = 2; required uint32 maxBytes = 3;
  repeated EditStyle styles = 4; required ResolvedRun linkStyle = 5;
}
message GradientStop { required double offset = 1; required string color = 2; }
message Background {
  required string kind = 1; optional string color = 2; optional double angleDegrees = 3;
  repeated GradientStop stops = 4;
}
message Border { required double width = 1; required string color = 2; }
message Corners { required string kind = 1; optional double radius = 2; }
message Outline { required double width = 1; required string color = 2; required double offset = 3; }
message States { optional Outline highlight = 1; optional Outline focus = 2; }
message Marker {
  required string kind = 1; required string color = 2; optional double diameter = 3;
  optional double insetX = 4; optional double insetY = 5; optional double size = 6; optional double gap = 7;
}
message ImagePaint { required string fit = 1; optional string rendering = 2; optional bool clipToCorners = 3; }
message Paint {
  required uint32 version = 1; required string units = 2; required string colorSpace = 3;
  required string foreground = 4; required Background background = 5; required Border border = 6;
  required Corners corners = 7; required bool clip = 8; required States states = 9;
  optional Marker marker = 10; optional ImagePaint image = 11;
}
message Range { required double minimum = 1; required double maximum = 2; required double value = 3; }
message Semantics {
  required uint32 version = 1; required string role = 2; required string label = 3;
  optional string value = 4; optional bool editable = 5; optional bool multiline = 6; optional Range range = 7;
}
message Config {
  optional bool grow = 1; optional double maxIdeal = 2; optional bool primary = 3; optional bool toggle = 4;
  optional string label = 5; optional string optionLabel = 6; optional double value = 7; optional double max = 8;
}
message Node {
  required string id = 1; optional string parentId = 2; required string kind = 3;
  required string role = 4; required string slot = 5; required string payload = 6;
  required Box box = 7; required TextStyle textStyle = 8; repeated Line lines = 9;
  required Paint paint = 10; required Semantics semantics = 11; required Config config = 12;
  optional TextRuns textRuns = 13; optional Editing editing = 14; optional string src = 15;
}
message Display {
  required uint32 version = 1; required Profile profile = 2; required Context context = 3;
  required string coordinates = 4; required double width = 5; required double height = 6; repeated Node nodes = 7;
}
message Snapshot {
  required string life = 1; required string subject = 2; required string target = 3;
  required string expected = 4; required string displayed = 5; required string publication = 6;
  optional uint64 projectionSeq = 7; repeated string coveredOperationIds = 8; optional string recipePublication = 9;
}
message Capture { required string slot = 1; required string selection = 2; }
message Binding {
  required uint32 version = 1; required string kind = 2; required string nodeId = 3; required string route = 4;
  required string slot = 5; repeated Capture captures = 6; required bool presented = 7;
}
message Control {
  required string id = 1; required string kind = 2; required string control = 3; required string slot = 4;
  required bool invoke = 5; required bool become = 6; repeated Capture captures = 7; required Binding binding = 8;
}
message Navigation { required string kind = 1; required string sourceSlot = 2; }
message Operation { required string key = 1; required string kind = 2; required string source = 3; }
message Host {
  required uint32 version = 1; required string kind = 2; required string declaration = 3;
  required Navigation navigation = 4; repeated Operation operations = 5;
}
message Pane {
  required string kind = 1; optional string renderer = 2; optional string topology = 3; optional string axis = 4;
  optional string key = 5; optional string source = 6; optional string selection = 7; optional string label = 8;
  optional string mode = 9; optional string browse = 10; optional string operation = 11; optional string slot = 12;
  optional string initial = 13; repeated Pane children = 14; optional string node = 15;
  optional Profile profile = 16; optional Context context = 17; optional Display display = 18;
  repeated Control controls = 19; optional string html = 20;
}
message Description { repeated Pane values = 1; }
message Presentation {
  required uint32 version = 1; required bool ok = 2; required Profile profile = 3; required Context context = 4;
  optional Snapshot snapshot = 5; optional string view = 6; required string kind = 7;
  optional Display display = 8; repeated Control controls = 9; optional Description description = 10;
  optional Host host = 11; optional string slot = 12; optional string role = 13; optional Origin origin = 14;
  optional string html = 15; optional string node = 16; optional Display readOnlyDisplay = 17;
}
message Layout { required string size = 1; required Presentation render = 2; }
message LayoutBundle {
  required uint32 version = 1; required bool ok = 2; required string layoutPolicy = 3;
  required Context context = 4; repeated Layout layouts = 5;
}
message Member {
  required string key = 1; required string subject = 2; required string source = 3; required string sourceLife = 4;
  required string life = 5; required string type = 6; required string expected = 7; required string status = 8;
  required string axis = 9; optional string face = 10; optional string topology = 11;
  optional string parent = 12; optional bool hasChildren = 13;
}
message PreparedMember { required string key = 1; required string slot = 2; required LayoutBundle bundle = 3; }
message Source {
  required string id = 1; required string life = 2; required string type = 3; required string axis = 4;
  required string topology = 5; required bool bounded = 6; repeated Member members = 7;
  optional bool incremental = 8; optional string epoch = 9; optional string parent = 10;
  optional string next = 11; optional uint64 omitted = 12; repeated PreparedMember presentations = 13;
}
message OperationReceipt { required string operationId = 1; required string outcome = 2; }
message Failure { required string error = 1; optional bool ok = 2; optional uint32 version = 3; optional string code = 4; }
