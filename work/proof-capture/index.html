<!doctype html><meta charset="utf-8"><title>Grove interaction capture</title>
<style>body{font:16px system-ui;background:#f6f7f2;color:#263a27;padding:40px}button,a{font:inherit;padding:12px 18px;display:inline-block;margin:8px;border:1px solid #ccd5c7;border-radius:6px}video{max-width:90vw;max-height:65vh}</style>
<h1>Record the real Grove window</h1><p>Select only the Grove window or tab. Audio is disabled. Capture stops automatically after 90 seconds.</p>
<button id="start">Start capture</button><button id="stop" disabled>Stop capture</button><span id="status">Ready</span><div><video controls id="preview"></video></div><a id="save" hidden>Save recording</a>
<script>
const readout=document.getElementById("status"),buttonStart=document.getElementById("start"),buttonStop=document.getElementById("stop"),previewVideo=document.getElementById("preview"),saveLink=document.getElementById("save");
let stream,recorder,chunks=[],timer;
buttonStart.onclick=async()=>{try{stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:25},audio:false});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{clearTimeout(timer);stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:recorder.mimeType});previewVideo.src=URL.createObjectURL(blob);saveLink.href=previewVideo.src;saveLink.download='grove-real-interaction.webm';saveLink.hidden=false;readout.textContent='Recorded '+Math.round(blob.size/1024)+' KiB';buttonStop.disabled=true;buttonStart.disabled=false};recorder.start(1000);buttonStart.disabled=true;buttonStop.disabled=false;readout.textContent='Recording Grove · 90 second maximum';timer=setTimeout(()=>{if(recorder.state==='recording')recorder.stop()},90000);stream.getVideoTracks()[0].onended=()=>{if(recorder.state==='recording')recorder.stop()}}catch(e){readout.textContent=e.name+': '+e.message}};
buttonStop.onclick=()=>{if(recorder?.state==='recording')recorder.stop()};
</script>
